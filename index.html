<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="검색 엔진을 선택해 빠르게 검색하는 통합 검색 페이지">
  <title>통합 검색</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="통합 검색 홈"><span class="brand-mark">⌕</span> 통합 검색</a>
      <button class="icon-button" id="settings-open" type="button" aria-label="검색 설정 열기" title="설정">⚙</button>
    </header>

    <section class="hero">
      <div class="eyebrow">ONE SEARCH, MANY DESTINATIONS</div>
      <h1>무엇이든 <span>검색해 보세요.</span></h1>
      <p class="subtitle">검색 엔진을 고르고, 원하는 정보를 빠르게 찾아보세요.</p>

      <div class="engine-list" role="group" aria-label="검색 엔진 선택">
        <button class="engine active" type="button" data-engine="google"><span class="engine-dot"></span>Google</button>
        <button class="engine" type="button" data-engine="naver"><span class="engine-dot"></span>네이버</button>
        <button class="engine" type="button" data-engine="namu"><span class="engine-dot"></span>나무위키</button>
      </div>

      <div class="search-wrap">
        <form class="search-form" id="search-form" role="search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="query" type="search" placeholder="검색어를 입력하세요" autocomplete="off" aria-label="검색어" aria-controls="suggestions" aria-expanded="false">
          <kbd class="enter-hint">Enter ↵</kbd>
          <button class="search-button" type="submit">검색</button>
        </form>
        <div class="suggestions" id="suggestions" role="listbox" aria-label="검색 추천" hidden></div>
      </div>
      <p class="keyboard-hint">↑ ↓ 이동 <span>·</span> Enter 선택/검색 <span>·</span> Esc 닫기</p>
    </section>

    <section class="history-section">
      <div class="section-heading">
        <div><span class="section-kicker">YOUR ACTIVITY</span><h2>최근 검색</h2></div>
        <button class="text-button" id="clear-history" type="button">기록 삭제</button>
      </div>
      <div class="history-list" id="history-list" aria-live="polite"></div>
    </section>
    <footer>검색 기록과 설정은 현재 브라우저에 저장됩니다.</footer>
  </main>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-header">
        <div><span class="section-kicker">PERSONALIZE</span><h2 id="settings-title">검색 설정</h2></div>
        <button class="icon-button" id="settings-close" type="button" aria-label="설정 닫기">✕</button>
      </div>
      <div class="setting-group">
        <h3>화면 테마</h3>
        <div class="choice-row" id="theme-options">
          <button type="button" data-theme="dark">어둡게</button>
          <button type="button" data-theme="light">밝게</button>
          <button type="button" data-theme="system">기기 설정</button>
        </div>
      </div>
      <div class="setting-group">
        <h3>기본 검색 엔진</h3>
        <select id="default-engine" class="setting-select">
          <option value="google">Google</option><option value="naver">네이버</option><option value="namu">나무위키</option>
        </select>
      </div>
      <div class="setting-group">
        <h3>검색 동작</h3>
        <label class="switch-row"><span>새 탭에서 검색 결과 열기</span><input id="new-tab" type="checkbox"><span class="switch"></span></label>
        <label class="switch-row"><span>자동완성 사용</span><input id="autocomplete" type="checkbox"><span class="switch"></span></label>
        <label class="switch-row"><span>최근 검색어를 추천에 포함</span><input id="history-suggestions" type="checkbox"><span class="switch"></span></label>
      </div>
      <div class="setting-group">
        <h3>추천어 표시 개수</h3>
        <select id="suggestion-count" class="setting-select">
          <option value="4">4개</option><option value="6">6개</option><option value="8">8개</option><option value="10">10개</option>
        </select>
      </div>
      <div class="settings-footer"><button class="reset-button" id="reset-settings" type="button">설정 초기화</button><button class="save-button" id="settings-done" type="button">완료</button></div>
    </section>
  </div>
</body>
</html>
